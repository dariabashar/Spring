spring:
  application:
    name: practice1
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5434/practice1
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 20

app:
  id:
    greeting: "Your uni id is"
    min-id-length: 9
    max-id-length: 9
